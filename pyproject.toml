[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-history-purge"
dynamic = ["version"]
description = "Remove leaked secrets, passwords, API keys and .env files from your entire git history, safely."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BrienAustinClayton" }]
dependencies = []
keywords = [
    "git",
    "git-history",
    "remove-secrets",
    "secret-scanning",
    "secrets-management",
    "leaked-secrets",
    "credentials",
    "api-keys",
    "dotenv",
    "gitleaks",
    "git-filter-repo",
    "bfg-repo-cleaner",
    "security",
    "devsecops",
    "history-rewrite",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/BrienAustinClayton/remove-secrets-from-git-history"
Repository = "https://github.com/BrienAustinClayton/remove-secrets-from-git-history"
Issues = "https://github.com/BrienAustinClayton/remove-secrets-from-git-history/issues"
Changelog = "https://github.com/BrienAustinClayton/remove-secrets-from-git-history/blob/main/CHANGELOG.md"

[project.scripts]
git-history-purge = "git_history_purge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "git_history_purge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["git_history_purge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end run that needs git 2.45+, git-filter-repo and gitleaks"]

[tool.ruff]
target-version = "py311"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
